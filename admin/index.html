
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | ThaiEgyptLuggage</title>

  <link rel="stylesheet" href="../assets/css/style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3f5f9;
      font-family: Arial, sans-serif;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #1d3557;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 7px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 7px;
      background: #1d3557;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #d62828;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>ThaiEgyptLuggage</h2>
    <p class="subtitle">Administrator Login</p>

    <form id="loginForm">
      <label for="email">อีเมล</label>
      <input
        type="email"
        id="email"
        required
        autocomplete="username"
        placeholder="กรอกอีเมล"
      >

      <label for="password">รหัสผ่าน</label>
      <input
        type="password"
        id="password"
        required
        autocomplete="current-password"
        placeholder="กรอกรหัสผ่าน"
      >

      <button type="submit" id="loginButton">
        เข้าสู่ระบบ
      </button>

      <p id="message" role="alert"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>

</body>
</html>
