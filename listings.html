
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประกาศทั้งหมด | Thai2Cairo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
            font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

        .page-header {
      background: linear-gradient(135deg, #173b70, #2878a8);
      color: white;
      padding: 34px 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      font-weight: 700;
      color: white;
    }

    .subtitle {
      margin: 0;
      opacity: 0.9;
    }

.search-box {
  width: 100%;
    padding: 13px 15px;
  font-family: inherit;
  margin-bottom: 20px;
  border: 1px solid #dce5f0;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  background: #ffffff;
}

.search-box:focus {
    border-color: #2878a8;
}

select.search-box {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 42px;
  cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23176b9a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 16px center;
}

    .listing {
      background: #ffffff;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

        .listing h3 {
      margin-top: 0;
      color: #172033;
    }

    .detail {
      margin: 9px 0;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

        .contact,
    .view-detail {
      display: inline-block;
      padding: 11px 18px;
      background: #172033;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }

    .view-detail {
      background: #eef1f6;
      color: #172033;
      border: none;
    }

    .message {
      padding: 20px;
      text-align: center;
      color: #666;
      background: white;
      border-radius: 10px;
    }

.result-count {
  margin: 0 0 12px;
  font-size: 14px;
  color: #666;
}

  </style>
</head>

<body>
  <main class="container">
        <header class="page-header">
      <h1 id="pageTitle">ประกาศทั้งหมด</h1>
      <p class="subtitle" id="pageSubtitle">
        ค้นหาประกาศพื้นที่กระเป๋าและบริการระหว่างไทย - อียิปต์
      </p>
    </header>

<input
  type="text"
  id="searchInput"
  class="search-box"
  placeholder="ค้นหาชื่อประกาศ ต้นทาง ปลายทาง หรือรายละเอียด..."
>

<select id="directionFilter" class="search-box">
  <option value="">ทุกเส้นทาง</option>
  <option value="TH_TO_EG">ไทย → อียิปต์</option>
  <option value="EG_TO_TH">อียิปต์ → ไทย</option>
</select>

<select id="categoryFilter" class="search-box">
  <option value="">ทุกหมวดหมู่</option>
    <option value="luggage">พื้นที่กระเป๋า</option>
  <option value="buying-service">ฝากซื้อสินค้า</option>
  <option value="marketplace">ซื้อขายสินค้า</option>
  <option value="shipping">ขนส่งพัสดุ</option>
  <option value="services">บริการต่าง ๆ</option>
  <option value="announcements">ประกาศทั่วไป</option>
</select>

<select id="posterFilter" class="search-box">
  <option value="">ทุกประเภทผู้โพสต์</option>
  <option value="traveler">ผู้เดินทางเอง</option>
  <option value="agent">ผ่านตัวแทน</option>
  <option value="unknown">ไม่ระบุ</option>
</select>

<select id="sortFilter" class="search-box">
  <option value="date">เรียงตาม: วันที่ใกล้ที่สุด</option>
    <option value="price_kg">เรียงตาม: ราคาต่อกิโล (ต่ำสุด)</option>
  <option value="price_bag">เรียงตาม: ราคาต่อใบ (ต่ำสุด)</option>
</select>
<p class="result-count" id="resultCount"></p>
    <div id="listingContainer">
      <div class="message">กำลังโหลดประกาศ...</div>
    </div>
  </main>

  <script>
    const listingContainer = document.getElementById("listingContainer");
    const searchInput = document.getElementById("searchInput");
    const directionFilter = document.getElementById("directionFilter");
        const categoryFilter = document.getElementById("categoryFilter");
        const sortFilter = document.getElementById("sortFilter");
    const posterFilter = document.getElementById("posterFilter");
    let allListings = [];

    const categoryNames = {
      "luggage": "พื้นที่กระเป๋า",
      "buying-service": "ฝากซื้อสินค้า",
      "marketplace": "ซื้อขายสินค้า",
      "shipping": "ขนส่งพัสดุ",
      "services": "บริการต่าง ๆ",
      "announcements": "ประกาศทั่วไป"
    };

    const params = new URLSearchParams(window.location.search);
    const selectedCategory = params.get("category");

        if (selectedCategory && categoryNames[selectedCategory]) {
      categoryFilter.value = selectedCategory;
    }

    function updatePageHeading() {
      const value = categoryFilter.value;

      if (value && categoryNames[value]) {
        document.getElementById("pageTitle").textContent =
          categoryNames[value];
        document.getElementById("pageSubtitle").textContent =
          "ประกาศในหมวดหมู่ " + categoryNames[value];
      } else {
        document.getElementById("pageTitle").textContent =
          "ประกาศทั้งหมด";
        document.getElementById("pageSubtitle").textContent =
          "ค้นหาประกาศพื้นที่กระเป๋าและบริการระหว่างไทย - อียิปต์";
      }
    }

    updatePageHeading();


async function loadListings() {
  let query = supabaseClient
    .from("listings")
    .select(`
      id,
      title,
      direction,
      origin,
      destination,
      travel_date,
      capacity_kg,
      price_per_kg,
      price_per_bag,
      poster_type,
      currency,
      category,
      description,
      contact_method,
      contact_url
    `)
    .eq("status", "approved")
    .gte("travel_date", new Date().toISOString().slice(0, 10));

  const { data, error } = await query
    .order("travel_date", { ascending: true });

  if (error) {
    listingContainer.textContent =
      "โหลดประกาศไม่สำเร็จ: " + error.message;
    listingContainer.className = "message";
    return;
  }

  allListings = data || [];
  renderListings();
}


function renderListings() {
  const keyword = searchInput.value.trim().toLowerCase();
    const selectedDirection = directionFilter.value;
  const selectedCategoryValue = categoryFilter.value;

  const results = allListings.filter(item => {
    const searchableText = [
      item.title,
      item.origin,
      item.destination,
      item.description
    ].join(" ").toLowerCase();

    const matchesKeyword =
      !keyword || searchableText.includes(keyword);

        const matchesDirection =
      !selectedDirection || item.direction === selectedDirection;

    const matchesCategory =
      !selectedCategoryValue || item.category === selectedCategoryValue;

        const selectedPoster = posterFilter.value;

    const matchesPoster =
      !selectedPoster ||
      (selectedPoster === "unknown"
        ? !item.poster_type
        : item.poster_type === selectedPoster);

    return matchesKeyword && matchesDirection && matchesCategory && matchesPoster;
  });

      const priceField =
    sortFilter.value === "price_kg" ? "price_per_kg" :
    sortFilter.value === "price_bag" ? "price_per_bag" : null;

  results.sort((a, b) => {
    if (priceField) {
      const aMissing = a[priceField] == null;
      const bMissing = b[priceField] == null;

      if (aMissing && !bMissing) return 1;
      if (!aMissing && bMissing) return -1;

      if (!aMissing && !bMissing && a[priceField] !== b[priceField]) {
        return a[priceField] - b[priceField];
      }
    }

    return a.travel_date.localeCompare(b.travel_date);
  });
document.getElementById("resultCount").textContent =
  "พบ " + results.length.toLocaleString("th-TH") + " รายการ";
  listingContainer.innerHTML = "";

  if (results.length === 0) {
    listingContainer.className = "message";
    listingContainer.textContent =
                        keyword || selectedDirection || selectedCategoryValue || posterFilter.value
        ? "ไม่พบประกาศที่ตรงกับเงื่อนไข"
        : "ยังไม่มีประกาศในขณะนี้";
    return;
  }

  listingContainer.className = "";

  results.forEach(item => {
    const card = document.createElement("article");
    card.className = "listing";

    const title = document.createElement("h3");
    title.textContent = item.title || "ไม่มีหัวข้อ";

    const direction = document.createElement("p");
    direction.className = "detail";
    direction.textContent =
      item.direction === "TH_TO_EG"
        ? "ไทย → อียิปต์"
        : "อียิปต์ → ไทย";

    const route = document.createElement("p");
    route.className = "detail";
    route.textContent =
      `เส้นทาง: ${item.origin || "-"} → ${item.destination || "-"}`;

    const date = document.createElement("p");
    date.className = "detail";

    const travelDate = new Date(item.travel_date + "T00:00:00");

    const formattedDate = new Intl.DateTimeFormat("th-TH-u-ca-buddhist", {
      day: "numeric",
      month: "long",
      year: "numeric"
    }).format(travelDate);

    date.textContent = "วันเดินทาง: " + formattedDate;

    const capacity = document.createElement("p");
    capacity.className = "detail";
    capacity.textContent =
      "พื้นที่: " + (item.capacity_kg ?? "-") + " กก.";

    const price = document.createElement("p");
    price.className = "detail";
        const priceParts = [];
    const currencyText = item.currency || "";

    if (item.price_per_kg != null) {
      priceParts.push(
        Number(item.price_per_kg).toLocaleString("en-US") +
        " " + currencyText + " / กก."
      );
    }

    if (item.price_per_bag != null) {
      priceParts.push(
        Number(item.price_per_bag).toLocaleString("en-US") +
        " " + currencyText + " / ใบ"
      );
    }

    price.textContent =
      "ราคา: " + (priceParts.length ? priceParts.join(" หรือ ") : "-");

    const description = document.createElement("p");
    description.className = "detail";
    description.textContent =
      "รายละเอียด: " + (item.description || "-");

    const actions = document.createElement("div");
    actions.className = "actions";

    const viewDetail = document.createElement("a");
    viewDetail.className = "view-detail";
    viewDetail.href =
      "listing-detail.html?id=" + encodeURIComponent(item.id);
    viewDetail.textContent = "ดูรายละเอียด";

    actions.appendChild(viewDetail);

    if (item.contact_url) {
      try {
        const url = new URL(item.contact_url);

        if (url.protocol === "https:" || url.protocol === "http:") {
          const contact = document.createElement("a");
          contact.className = "contact";
          contact.href = url.href;
          contact.target = "_blank";
          contact.rel = "noopener noreferrer";
          contact.textContent = "ติดต่อผู้ประกาศ";
          actions.appendChild(contact);
        }
      } catch (e) {
        // ไม่แสดงลิงก์ที่ไม่ถูกต้อง
      }
    }

    card.append(
      title,
      direction,
      route,
      date,
      capacity,
      price,
      description,
      actions
    );

    listingContainer.appendChild(card);
  });
}


searchInput.addEventListener("input", renderListings);
directionFilter.addEventListener("change", renderListings);
categoryFilter.addEventListener("change", renderListings);
sortFilter.addEventListener("change", renderListings);
posterFilter.addEventListener("change", renderListings);
categoryFilter.addEventListener("change", updatePageHeading);

loadListings();

  </script>
</body>
</html>
