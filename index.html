  <style>

    .container {

    header {

    }

    .navbar {
      min-height: 70px;

    }
  </style>

  <script>
    const listingContainer =
      document.getElementById("listingContainer");

    const searchInput =
      document.getElementById("searchInput");

    const listingHeading =
      document.getElementById("listingHeading");

    const posterFilter = document.getElementById("posterFilter");
        const sortFilter = document.getElementById("sortFilter");
    const dateFrom = document.getElementById("dateFrom");
    const dateTo = document.getElementById("dateTo");

    let allListings = [];
    let selectedDirection = "";

    async function loadListings() {
      const { data, error } = await supabaseClient
        .from("listings")
                .select(`
          id,
          title,
          direction,
          origin,
          destination,
          travel_date,
          capacity_kg,
          price_per_kg,
          price_per_bag,
          poster_type,
          dropoff_point,
          pickup_point,
          source_url,
          currency,
          description,
          contact_url
        `)
                .eq("status", "approved")
        .eq("category", "luggage")
        .gt("travel_date", new Date().toISOString().slice(0, 10))
        .order("travel_date", { ascending: true });
      if (error) {
        listingContainer.innerHTML = "";
        const message = document.createElement("div");
        message.className = "empty-message";
        message.textContent =
          "โหลดประกาศไม่สำเร็จ: " + error.message;
        listingContainer.appendChild(message);
        return;
      }

      allListings = data || [];
      renderListings();
    }

    function renderListings() {
      const keyword = searchInput.value.trim().toLowerCase();

      let results = allListings.filter(item => {
        const matchesDirection =
          !selectedDirection ||
          item.direction === selectedDirection;

        const searchableText = [
          item.title,
          item.origin,
          item.destination,
          item.description
        ].concat([item.dropoff_point, item.pickup_point]).join(" ").toLowerCase();

        const matchesKeyword =
          !keyword || searchableText.includes(keyword);

                const selectedPoster = posterFilter.value;

        const matchesPoster =
          !selectedPoster ||
          (selectedPoster === "unknown"
            ? !item.poster_type
            : item.poster_type === selectedPoster);

                let matchesDate = true;
        if (dateFrom.value || dateTo.value) {
          const a = dateFrom.value || dateTo.value;
          const b = dateTo.value || dateFrom.value;
          const start = a <= b ? a : b;
          const end = a <= b ? b : a;
          matchesDate = item.travel_date >= start && item.travel_date <= end;
        }

        return matchesDirection && matchesKeyword && matchesPoster && matchesDate;
      });

      const priceField =
        sortFilter.value === "price_kg" ? "price_per_kg" :
        sortFilter.value === "price_bag" ? "price_per_bag" : null;

      results.sort((a, b) => {
        if (priceField) {
          const aMissing = a[priceField] == null;
          const bMissing = b[priceField] == null;

          if (aMissing && !bMissing) return 1;
          if (!aMissing && bMissing) return -1;

          if (!aMissing && !bMissing && a[priceField] !== b[priceField]) {
            return a[priceField] - b[priceField];
          }
        }

        return a.travel_date.localeCompare(b.travel_date);
      });

document.getElementById("resultCount").textContent =
  "พบ " + results.length.toLocaleString("th-TH") + " รายการ";

      listingContainer.innerHTML = "";

      if (results.length === 0) {
  const message = document.createElement("div");
  message.className = "empty-message";
    message.textContent = (keyword || selectedDirection || posterFilter.value || dateFrom.value || dateTo.value)
    ? "ไม่พบประกาศที่ตรงกับการค้นหา"
    : "ยังไม่มีประกาศในขณะนี้";
  listingContainer.appendChild(message);
  return;
}

      results.forEach(item => {
        const card = document.createElement("article");
        card.className = "listing";

        const title = document.createElement("h3");
        title.textContent = item.title || "ไม่มีหัวข้อ";

      

                let travelerBadge = null;
        if (item.poster_type === "traveler") {
          travelerBadge = document.createElement("span");
          travelerBadge.className = "direction traveler-badge";
          travelerBadge.textContent = "ผู้เดินทาง";
        }

        const route = document.createElement("p");
        route.textContent =
          `เส้นทาง: ${item.origin || "-"} → ${item.destination || "-"}`;

        const date = document.createElement("p");
        const travelDate = new Date(item.travel_date + "T00:00:00");

        const formattedDate = new Intl.DateTimeFormat("th-TH-u-ca-buddhist", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(travelDate);

        date.textContent = "วันเดินทาง: " + formattedDate;

                const infoLines = [];

                if (item.poster_type === "agent") {
          infoLines.push("ประเภทผู้โพสต์: ผ่านตัวแทน");
        }

        if (item.dropoff_point) {
          infoLines.push("จุดฝาก: " + item.dropoff_point);
        }

        if (item.pickup_point) {
          infoLines.push("จุดรับสินค้า: " + item.pickup_point);
        }

        const infoElements = infoLines.map(function (text) {
          const line = document.createElement("p");
          line.textContent = text;
          return line;
        });

        let capacity = null;
        if (item.capacity_kg != null) {
          capacity = document.createElement("p");
          capacity.textContent = "พื้นที่: " + item.capacity_kg + " กก.";
        }

        const priceParts = [];
        const currencyText = item.currency || "";

        if (item.price_per_kg != null) {
          priceParts.push(
            Number(item.price_per_kg).toLocaleString("en-US") +
            " " + currencyText + " / กก."
          );
        }

        if (item.price_per_bag != null) {
          priceParts.push(
            Number(item.price_per_bag).toLocaleString("en-US") +
            " " + currencyText + " / ใบ"
          );
        }

        let price = null;
        if (priceParts.length) {
          price = document.createElement("p");
          price.textContent = "ราคา: " + priceParts.join(" หรือ ");
        }

        let description = null;
        const descriptionText = (item.description || "").trim();
        if (descriptionText) {
          description = document.createElement("p");
          description.textContent = "รายละเอียด: " + descriptionText;
        }

                const detail = document.createElement("a");
        detail.className = "detail-icon";
        detail.href = `listing-detail.html?id=${encodeURIComponent(item.id)}`;
        detail.setAttribute("aria-label", "ดูรายละเอียด");
        detail.title = "ดูรายละเอียด";
        detail.innerHTML =
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="2.5" stroke-linecap="round" ' +
          'stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>';
        card.append(
          ...[title, travelerBadge, route, date, ...infoElements, capacity, price, description, detail]
                      .filter(Boolean)
        );

        if (item.contact_url) {
          try {
            const url = new URL(item.contact_url);

            if (url.protocol === "https:" || url.protocol === "http:") {
              const contact = document.createElement("a");
              contact.className = "contact";
              contact.href = url.href;
              contact.target = "_blank";
              contact.rel = "noopener noreferrer";
              contact.textContent = "แชท";
              card.appendChild(contact);
            }
          } catch (e) {
            // ไม่แสดงลิงก์ที่ไม่ถูกต้อง
          }
        }

                if (item.source_url) {
          try {
            const profileUrl = new URL(item.source_url);
            const host = profileUrl.hostname.toLowerCase();

            if (
              (profileUrl.protocol === "https:" ||
                profileUrl.protocol === "http:") &&
              (host === "facebook.com" || host.endsWith(".facebook.com"))
            ) {
              const profile = document.createElement("a");
              profile.className = "contact profile-link";
              profile.href = profileUrl.href;
              profile.target = "_blank";
              profile.rel = "noopener noreferrer";
              profile.textContent = "โปรไฟล์";
              card.appendChild(profile);
            }
          } catch (e) {
            // ไม่แสดงลิงก์ที่ไม่ถูกต้อง
          }
        }

        listingContainer.appendChild(card);
      });
    }

    function setDirection(direction) {
      if (selectedDirection === direction) {
        direction = "";
      }

      selectedDirection = direction;

      document.getElementById("thToEg")
        .classList.toggle("active", direction === "TH_TO_EG");

      document.getElementById("egToTh")
        .classList.toggle("active", direction === "EG_TO_TH");

      listingHeading.textContent =
        direction === "TH_TO_EG"
          ? "ประกาศไทย → อียิปต์"
          : direction === "EG_TO_TH"
            ? "ประกาศอียิปต์ → ไทย"
            : "ประกาศล่าสุด";

      renderListings();
    }

    document.getElementById("thToEg")
      .addEventListener("click", () => setDirection("TH_TO_EG"));

    document.getElementById("egToTh")
      .addEventListener("click", () => setDirection("EG_TO_TH"));

    document.getElementById("searchButton")
      .addEventListener("click", renderListings);

        searchInput.addEventListener("input", renderListings);
    posterFilter.addEventListener("change", renderListings);
        sortFilter.addEventListener("change", renderListings);
    dateFrom.addEventListener("change", renderListings);
    dateTo.addEventListener("change", renderListings);

    document.getElementById("clearDates")
      .addEventListener("click", function () {
        dateFrom.value = "";
        dateTo.value = "";
        renderListings();
      });

    loadListings();
  </script>

</body>
</html>
